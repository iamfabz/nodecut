<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- NodeCut mark: a browser frame with a play triangle — the studio draws frames in code and plays them back.
       Traced from the brand artwork (nodecut logo), rebuilt as vector so it stays sharp at 16 px and at 1024 px. -->
  <defs>
    <linearGradient id="nc-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd8fd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="nc-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0a0a0c"/>

  <g filter="url(#nc-glow)">
    <!-- the frame -->
    <rect x="27" y="35" width="74" height="58" rx="5.5" fill="#0e1621" stroke="url(#nc-cyan)" stroke-width="3.4"/>
    <!-- the title bar and its four ticks -->
    <path d="M28.7 46.5h70.6" stroke="url(#nc-cyan)" stroke-width="2.6"/>
    <g stroke="#7dd8fd" stroke-width="2.2" stroke-linecap="round">
      <path d="M46.5 39.2v4.2"/>
      <path d="M61 39.2v4.2"/>
      <path d="M75.5 39.2v4.2"/>
      <path d="M90 39.2v4.2"/>
    </g>
    <!-- the play triangle -->
    <path d="M57 55.5l17.5 10.5L57 76.5Z" fill="#ffffff"/>
    <!-- the two hairline rails either side of it -->
    <g stroke="#7dd8fd" stroke-width="2.2" stroke-linecap="round">
      <path d="M45.5 55.5v21"/>
      <path d="M83 55.5v21"/>
    </g>
  </g>
</svg>
