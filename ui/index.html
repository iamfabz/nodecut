<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NodeCut</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/review.css">
</head>
<body>
  <!-- The brand layer: the mark and the wordmark, centred in the content column and scaled to fill it, sitting above
       the ambient backdrop and below every panel. It is a sibling of .app rather than a child so that it is not clipped
       by the page's scroll container, and it is positioned off the sidebar's own width so it lands in the column to the
       right of the nav and never under it. aria-hidden because it is decoration: a screen reader announcing the
       product name inside its own product is noise.

       The mark is inlined rather than an <img src="/logo-mark.svg"> because the artwork is drawn in currentColor, and a
       replaced element like an <img> cannot inherit a CSS colour — it rendered as an invisible shape. Inlined, the one
       `color` on .wm-mark tints the whole mark. -->
  <div class="wm" id="wm" aria-hidden="true">
    <div class="wm-frost">
      <div class="wm-lockup">
        <svg class="wm-mark" viewBox="0 0 128 128" fill="none" aria-hidden="true">
          <rect x="27" y="35" width="74" height="58" rx="5.5" stroke="currentColor" stroke-width="3.4"/>
          <path d="M28.7 46.5h70.6" stroke="currentColor" stroke-width="2.6"/>
          <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M46.5 39.2v4.2"/><path d="M61 39.2v4.2"/><path d="M75.5 39.2v4.2"/><path d="M90 39.2v4.2"/>
          </g>
          <path d="M57 55.5l17.5 10.5L57 76.5Z" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M45.5 55.5v21"/><path d="M83 55.5v21"/>
          </g>
        </svg>
        <span class="wm-word">NodeCut</span>
      </div>
    </div>
  </div>
  <div class="app">
    <aside class="side">
      <div class="logo">
        <img src="/icon.svg" alt="" width="26" height="26">
        NodeCut
      </div>
      <button class="sidett" id="sideToggle" aria-label="Hide the menu" title="Hide the menu" aria-expanded="true">‹</button>
      <nav class="nav">
        <a href="#/" data-nav="projects" title="Home">Home</a>
        <a href="#/renders" data-nav="renders" title="Renders">Renders <span class="count" id="renderCount" hidden></span></a>
        <a href="#/settings" data-nav="settings" title="Settings">Settings</a>
        <a href="#/disk" data-nav="disk" class="sub" title="Disk">Disk</a>
      </nav>
      <div class="live" id="live">…</div>
    </aside>
    <main class="main" id="main"></main>
    <button class="sidett-float" id="sideReveal" aria-label="Show the menu" title="Show the menu" aria-expanded="false" hidden>›</button>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
